<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebGL SDF</title>
  <style>
    body {
      background: rgba(6, 8, 10, 0.9);

    }

    .gl_container {
      position: relative;
    }

    #sdf {
      display: flex;
      flex-direction: row;
      align-items: stretch;
    }

    #editor {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-items: stretch;
      margin: auto;
    }

    #view {
      margin: auto;
      display: flex;
      align-items: center;
      flex-direction: column;
      color: #0f0;
    }

    canvas {
      display: block;
      margin: 0 auto;
    }

    button {
      display: block;
      margin: 0 auto;
      font-size: 1em;
    }

    p {
      text-align: center;
    }

    #fps {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 4px 8px;
      background: rgba(0, 0, 0, 0.6);
      color: #0f0;
      font-family: monospace;
      font-size: 14px;
      border-radius: 4px;
    }
  </style>
</head>

<body>
  <div id="sdf">
    <script type="module" src="script.js"></script>
    <div id="view">
      <p>Click to move, Scroll to zoom, Esc to unlock mouse</p>
      <button id='toggle' type="button">Start Animation</button>
      <div class="gl_container">
        <canvas id="glCanvas" width="500" height="500" style="max-width:100%;height:auto;">
        </canvas>
        <div id="fps">FPS: —</div>
      </div>
    </div>
    <div id="editor">
      <textarea name="figure_in" id="figure_in" rows="30" cols="50"></textarea>
      <button id="update" type="button">Update figure</button>
    </div>
  </div>
</body>
