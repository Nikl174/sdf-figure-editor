<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>SDF Figure Editor</title>
  <script src="main.js" type="module"></script>

  <style>
    :root {
      /* Theme Variables */
      --bg-main: #1d2021;
      --bg-panel: #282828;
      --bg-input: #141617;

      --text-main: #ebdbb2;
      --text-muted: #a89984;

      /* --accent: #d79921; */
      /* --accent-hover: #fabd2f; */
      --border: #504945;

      /* --accent: #458588; */
      /* --accent-hover: #83a598; */
      /* --border: #3a4a4d; */

      --accent: #98971a;
      --accent-hover: #b8bb26;
      --bg-slider: #5a5f2a;
      /* --border: #4a4f2a; */



      --radius: 4px;
      --font-sans: system-ui, -apple-system, sans-serif;
      --font-mono: "Fira Code", ui-monospace, monospace;
    }

    :root.light {
      --bg-main: #fbf1c7;
      --bg-panel: #ebdbb2;
      --bg-input: #f9f5d7;

      --text-main: #3c3836;
      --text-muted: #7c6f64;

      --accent: #787700;
      --accent-hover: #989b06;
      --bg-slider: #787700;
      /* --bg-slider: #c2c76a; */

      --border: #d5c4a1;


      --radius: 4px;
      --font-sans: system-ui, -apple-system, sans-serif;
      --font-mono: "Fira Code", ui-monospace, monospace;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg-main);
      font-family: var(--font-sans);
      color: var(--text-main);
      height: 100vh;
      /* overflow: hidden; */
      /* Desktop app feel */
      overflow: auto;
      display: flex;
      flex-direction: column;
    }

    /* Layout */
    #sdf {
      display: flex;
      flex-direction: row;
      height: 100%;
      width: 100%;
    }

    sdf-editor {
      width: 320px;
      flex-shrink: 0;
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
    }

    #sdf-half {
      flex: 1;
      display: flex;
      flex-direction: row;
      min-width: 0;
    }

    sdf-canvas {
      flex: 1;
      min-width: 0;
    }

    #settings {
      width: 300px;
      flex-shrink: 0;
      background: var(--bg-panel);
      border-left: 1px solid var(--border);
      padding: 1rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    /* Global UI Elements (applied to light DOM) */
    fieldset {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      margin: 0;
    }

    legend {
      padding: 0 8px;
      color: var(--text-muted);
      font-size: 0.9em;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      padding-right: 0.8em;
    }

    .checkbox-group:last-child {
      margin-bottom: 0;
    }

    input[type="checkbox"] {
      appearance: none;
      width: 18px;
      height: 18px;
      border: 2px solid var(--border);
      border-radius: 4px;
      background: var(--bg-input);
      cursor: pointer;
      position: relative;
    }

    input[type="checkbox"]:checked {
      background: var(--accent);
      border-color: var(--accent);
    }

    input[type="checkbox"]:checked::after {
      content: '✔';
      position: absolute;
      color: white;
      font-size: 12px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    label {
      cursor: pointer;
      font-size: 0.95em;
    }

    header,
    footer {
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      padding: 0.25rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    footer {
      border-top: 1px solid var(--border);
      border-bottom: none;
      flex-direction: column;
      text-align: center;
      font-size: 0.75em;
      padding: 0 1rem;
      color: var(--text-muted);
    }

    header h1 {
      margin: 0;
      font-size: 1.2rem;
      color: var(--accent);
    }

    header nav a {
      margin-left: 1rem;
      color: var(--text-main);
      text-decoration: none;
    }

    header nav a:hover {
      color: var(--accent-hover);
    }

    button {
      background: var(--accent);
      color: var(--bg-main);
      border: 1px solid var(--border);
      padding: 0.4rem 0.8rem;
      border-radius: var(--radius);
      font-size: 0.9rem;
      /* cursor: pointer; */
      transition: background 0.2s, color 0.2s;
    }

    a {
      color: var(--accent);
      text-decoration: none;
      transition: color 0.2s;
    }

    a:hover {
      color: var(--accent-hover);
      text-decoration: underline;
    }


    button:hover {
      background: var(--accent-hover);
    }

    button:active {
      transform: scale(0.97);
    }

    /* Responsive Design */
    @media (max-width: 1100px) {
      body {
        height: auto;
        overflow: auto;
        /* Enable scrolling on mobile */
      }

      #sdf,
      #sdf-half {
        flex-direction: column;
      }

      sdf-canvas {
        height: 50vh;
      }

      #settings,
      sdf-editor {
        width: 100%;
        border-right: none;
        border-left: none;
        border-top: 1px solid var(--border);
      }

      sdf-editor {
        height: 50vh;
      }

      fieldset {
        display: flex;
      }

      /* Stack order on mobile: Canvas, Settings, Editor */
      #sdf-half {
        order: 1;
      }

      sdf-editor {
        order: 2;
      }
    }
  </style>
  <style>
    .switch {
      --switch-width: 52px;
      --switch-height: 26px;
      --knob-size: 22px;

      position: relative;
      width: var(--switch-width);
      height: var(--switch-height);
      background: var(--bg-slider);
      border-radius: var(--switch-height);
      border: none;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .switch .icon {
      width: 50%;
      text-align: center;
      pointer-events: none;
    }

    .switch .knob {
      position: absolute;
      top: 2px;
      left: 2px;
      width: var(--knob-size);
      height: var(--knob-size);
      background: var(--text-main);
      border-radius: 50%;
      transition: transform .25s ease;
      pointer-events: none;
    }

    /* When light mode is active */
    .light .switch {
    }

    .light .switch .knob {
      transform: translateX(26px);
    }
  </style>
</head>


<header>
  <h1>SDF Figure Editor</h1>
  <nav>
    <button id="theme-toggle" class="switch">
      <span class="icon sun">🔆</span>
      <span class="icon moon">🌙</span>
      <span class="knob"></span>
    </button>

  </nav>
</header>

<script>
  document.getElementById("theme-toggle").onclick = () => {
    document.documentElement.classList.toggle("light");
  };
</script>

<body>
  <div id="sdf">
    <sdf-editor id="sdf-editor"></sdf-editor>

    <div id="sdf-half">
      <sdf-canvas id="sdf-view"></sdf-canvas>

      <div id="settings">
        <fieldset>
          <legend>Global Settings</legend>
          <div class="checkbox-group">
            <input type="checkbox" name="rotate" id="rotate">
            <label for="rotate">Rotate</label>
          </div>
          <div class="checkbox-group">
            <input type="checkbox" name="animate" id="animate">
            <label for="animate">Animating</label>
          </div>
          <div class="checkbox-group">
            <input type="checkbox" name="edit" id="edit">
            <label for="edit">Edit Figure</label>
          </div>
        </fieldset>

        <figure-node-editor id="node-editor"></figure-node-editor>
      </div>
    </div>
  </div>
</body>

<footer>
  <p>
    © 2026 Nikl174 — AGPLv3 License<br>
    Source available on <a href="https://github.com/Nikl174/sdf-figure-editor">GitHub</a>
  </p>
</footer>


</html>
