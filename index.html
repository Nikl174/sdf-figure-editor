<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>SDF Figure Editor</title>
  <script src="components/SDFCanvas.js" type="module"></script>
  <script src="components/FigureEditor.js" type="module"></script>

  <style>
    body {
      margin: 0;
      background: rgba(6, 8, 10, 0.9);
      font-family: sans-serif;
    }

    #sdf {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      height: 100vh;
      width: 100%;
    }

    sdf-canvas {
      flex: 1;
      min-width: 0;
    }

    sdf-editor {
      flex: 1;
      min-width: 0;
      overflow: auto;
      resize: vertical;
    }

    /* Make canvas fill its container */
    #sdf-view {
      width: 100%;
      height: 100%;
    }

    #sdf-half {
      display: flex;
      flex-direction: row;
    }

    #settings {
      flex: 0;
      min-width: 20%;
      align-items: stretch;
    }

    /* Responsive: stack on small screens */
    @media (max-width: 900px) {

      /* #sdf { */
      /*   flex-direction: column; */
      /* } */
      #settings {
        flex: 0;
        min-width: 20%;
        align-items: stretch;
      }

      sdf-canvas {
        height: 50vh;
      }

      sdf-editor {
        height: 50vh;
      }
    }
  </style>
</head>

<body>

  <div id="sdf">
    <div id="sdf-half">
      <sdf-canvas id="sdf-view" width='500' height='500'></sdf-canvas>
      <fieldset id="settings">
        <legend>Settings</legend>
        <div>
          <input type="checkbox" name="rotate" id="rotate">
          <label for="rotate">Rotate</label>
        </div>
        <div>
          <input type="checkbox" name="animate" id="animate">
          <label for="animate">Animating</label>
        </div>
      </fieldset>
    </div>
    <sdf-editor id="sdf-editor"></sdf-editor>
  </div>

  <script src="main.js" type="module"></script>

</body>

</html>
